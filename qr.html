<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码登记</title>
<style>
  :root { --bg: #ffffff; --text: #1f2328; --muted: #656d76; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  h1 { font-size: clamp(28px, 5vw, 56px); margin: 0 0 8px; }
  p { font-size: clamp(16px, 2.2vw, 26px); color: var(--muted); margin: 0 0 32px; }
  #qr { padding: 16px; background: #fff; } /* 二维码始终白底，投影仪上更好扫 */
  #qr img, #qr canvas { width: min(70vmin, 520px) !important; height: auto !important; display: block; }
  .url { margin-top: 24px; font-size: clamp(14px, 1.8vw, 22px); color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
  <h1>扫码登记 GitHub 账号</h1>
  <p>手机扫一扫，填写 GitHub 用户名和真实姓名</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // 指向同目录下的 index.html，部署到哪里都不用改
  const target = new URL("./", location.href).href;
  document.getElementById("url").textContent = target;
  new QRCode(document.getElementById("qr"), {
    text: target, width: 1024, height: 1024, correctLevel: QRCode.CorrectLevel.M,
  });
</script>
</body>
</html>
